[package]
name = "autumn-plugin-svelte"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Autumn plugin: Svelte 5 islands in Maud + htmx pages."
license = "Apache-2.0"
repository = "https://github.com/autumn-foundation/autumn-plugin-svelte"
readme = "README.md"
keywords = ["autumn", "svelte", "islands", "htmx", "plugin"]
categories = ["web-programming"]
exclude = [".github/", "docs/", "frontend/", "CLAUDE.md", "clippy.toml"]

[dependencies]
# No default features: the host app selects the Autumn features.
autumn-web = { version = "0.8", default-features = false, features = ["maud"] }
# `html!` expands to `maud::` paths, so this crate needs `maud` by name.
maud = "0.27"
serde = "1"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
autumn-web = { version = "0.8", default-features = false, features = ["maud", "htmx", "system-tests"] }
base64 = "0.22"
proptest = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
redundant_pub_crate = "allow"

[[example]]
name = "svelte_demo"
# `cargo test` also runs the smoke tests in the example.
test = true
